<!doctype html><html lang="th"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Portrait Academy</title><style>body{background:#10141d;color:#f4f1ea;font:16px system-ui;margin:0}header,main{max-width:850px;margin:auto;padding:22px}header{border-bottom:1px solid #40444c}h1{color:#eac38b}button,select,input,textarea{background:#262e3b;color:white;border:1px solid #596171;border-radius:9px;padding:11px}button{cursor:pointer}nav{display:flex;gap:8px;flex-wrap:wrap}section{background:#1c2430;border-radius:15px;padding:20px;margin:18px 0}.muted{color:#b8c0ce}.task{display:block;padding:10px;border-bottom:1px solid #343d4a}img{max-width:100%}textarea{width:90%}</style><header><h1>📸 Portrait Academy</h1><p class="muted">ฝึก Portrait Photography ด้วย vivo V30 · Beginner → Advanced</p><nav><button onclick="show('learn')">Learn</button><button onclick="show('practice')">Practice</button><button onclick="show('lab')">Lighting Lab</button><button onclick="show('journal')">Journal</button></nav></header><main><div id="view"></div></main><script>
const lessons=['Lighting Direction','Composition & Camera Angle','Posing & Body Language','Exposure & Focus','Natural Light','Night Portrait','Aura Light','Color & White Balance','Lightroom Mobile','Creative Direction','Photographing Others','Advanced Portfolio'];
const tasks=['Front lighting','45° lighting','Side lighting','Back lighting','Top lighting','Low angle','Eye level','Rule of Thirds','Leading Lines','Symmetry','Negative Space','Night close-up'];
const key='portrait-academy-v1';let state;try{state=JSON.parse(localStorage.getItem(key))||{done:[],notes:[]}}catch{state={done:[],notes:[]}};function save(){localStorage.setItem(key,JSON.stringify(state))}function show(tab){const v=document.getElementById('view');if(tab==='learn')v.innerHTML='<section><h2>12 บทเรียน</h2>'+lessons.map((x,i)=>'<p><b>บท '+(i+1)+': '+x+'</b><br><span class="muted">'+(i<2?'พื้นฐานสำคัญสำหรับการถ่าย Portrait':'ฝึกและทดลองถ่ายภาพจริง')+'</span></p>').join('')+'</section>';if(tab==='practice')v.innerHTML='<section><h2>ภารกิจฝึก</h2><p class="muted">สำเร็จ '+state.done.length+'/'+tasks.length+' ภารกิจ</p>'+tasks.map((x,i)=>'<label class="task"><input type="checkbox" '+(state.done.includes(i)?'checked':'')+' onchange="toggle('+i+',this.checked)"> '+x+' — ถ่าย 5 ภาพ</label>').join('')+'</section>';if(tab==='lab')v.innerHTML='<section><h2>Lighting Simulator</h2><p>ปรับมุมแสงรอบตัวแบบ (0° = หน้า, 90° = ข้าง, 180° = หลัง)</p><input id="angle" type="range" min="0" max="180" step="15" value="45" oninput="renderLight()"><p id="angleLabel"></p><svg width="100%" viewBox="0 0 320 240"><rect width="320" height="240" rx="15" fill="#152332"/><circle cx="160" cy="118" r="38" fill="#c59b7e"/><circle id="lamp" cx="85" cy="180" r="17" fill="#efc77e"/><path id="ray" stroke="#efc77e" stroke-width="2" stroke-dasharray="5 5"/><text x="160" y="225" fill="white" text-anchor="middle">ด้านหน้า / กล้อง</text></svg><p class="muted">ทดลองถ่ายจริงเพื่อดูเงา: ภาพนี้เป็นเพียงแผนผังทิศทางแสง</p></section><section><h2>vivo V30 Night Setup</h2><p>กล้องหลัง 1× · Photo Mode · Grid เปิด · Beauty ปิด · Timer 3 วินาที · ตั้งขาตั้งมั่นคง</p><p>เริ่มจากไฟถนนหรือไฟอาคารที่ส่องหน้าเพียงพอ หากตัวแบบเคลื่อนไหวให้ใช้ Shutter เร็วขึ้น</p></section>';if(tab==='lab')renderLight();if(tab==='journal')v.innerHTML='<section><h2>Photo Journal</h2><p>บันทึกผลการฝึกและสิ่งที่ต้องปรับ</p><input id="subject" placeholder="ชื่อเซสชัน เช่น Night Street"><p><textarea id="notes" rows="4" placeholder="แสง มุมกล้อง สิ่งที่เรียนรู้"></textarea></p><button onclick="addNote()">บันทึก</button><button onclick="backup()">ส่งออกข้อมูล JSON</button>'+state.notes.map(n=>'<p><b>'+esc(n.title)+'</b><br>'+esc(n.note)+'</p>').join('')+'</section>'}function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}function toggle(i,on){state.done=on?[...new Set([...state.done,i])]:state.done.filter(x=>x!==i);save();show('practice')}function addNote(){state.notes.unshift({title:document.getElementById('subject').value,note:document.getElementById('notes').value});save();show('journal')}function renderLight(){const a=Number(document.getElementById('angle').value),r=a*Math.PI/180,x=160-90*Math.sin(r),y=118+90*Math.cos(r);document.getElementById('lamp').setAttribute('cx',x);document.getElementById('lamp').setAttribute('cy',y);document.getElementById('ray').setAttribute('d','M'+x+' '+y+' L160 118');document.getElementById('angleLabel').textContent=a+'° — '+(a<60?'Front / 45°':a<120?'Side':'Back')+' Lighting'}function backup(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='portrait-academy-backup.json';a.click();URL.revokeObjectURL(a.href)}show('learn');
</script></html>
